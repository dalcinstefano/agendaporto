<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Portomansuè</title>
<meta name="theme-color" content="#17984d">
<meta name="robots" content="noindex">
<script>var STATICO = true;</script>
</head>
<body>

<style>
  :root{
    --verde:#17984d; --verde-scuro:#0d7038; --verde-chiaro:#e8f6ee;
    --testo:#16241c; --tenue:#6b7c72; --tenue-forte:#3f5349;
    --bordo:#dde5e0; --fondo:#f5f7f6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fondo); color:var(--testo);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }

   
  header{
    position:sticky; top:0; z-index:20;
    background:var(--verde); color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 12px 0;
    box-shadow:0 2px 10px rgba(0,0,0,.16);
  }
  .marchio{display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:.2px}
  .marchio .scudo{height:34px; width:auto; flex:0 0 auto; display:block}
  .marchio small{display:block; font-weight:500; font-size:11px; opacity:.85; letter-spacing:.3px}
  .sezioni{display:flex; gap:4px; margin-top:10px}
  .sezioni button{
    flex:1; background:none; border:0; color:#fff; opacity:.7;
    font:600 14px/1 inherit; padding:11px 4px; cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .sezioni button[aria-selected="true"]{opacity:1; border-bottom-color:#fff}

   
  .barra{padding:10px 12px 6px; display:flex; gap:7px; flex-wrap:wrap; align-items:center}
  .pill{
    border:1px solid var(--bordo); background:#fff; color:var(--tenue);
    border-radius:999px; padding:6px 13px; font:600 13px/1 inherit; cursor:pointer;
  }
  .pill[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:#fff}
  .cerca{
    flex:1 1 100%; min-width:0; border:1px solid var(--bordo); background:#fff;
    border-radius:10px; padding:9px 12px; font:15px inherit; color:var(--testo);
  }
  .cerca:focus{outline:2px solid var(--verde); outline-offset:-1px}

   
  .periodo{display:flex; gap:6px; align-items:center; padding:2px 12px 0}
  .periodo .freccia,.periodo .oggi{
    flex:0 0 auto; border:1px solid var(--bordo); background:#fff; color:var(--testo);
    border-radius:8px; padding:6px 10px; font:600 14px/1 inherit; cursor:pointer;
  }
  .periodo .oggi{font-size:12.5px}
   
  .periodo button[disabled]{opacity:.35; cursor:default}
  .scelta{display:flex; flex:1; border:1px solid var(--bordo); border-radius:8px; overflow:hidden; background:#fff}
  .scelta button{
    flex:1; border:0; background:none; color:var(--tenue);
    font:600 13px/1 inherit; padding:7px 2px; cursor:pointer;
  }
  .scelta button[aria-pressed="true"]{background:var(--verde); color:#fff}
  .etichetta{
    text-align:center; font:600 11.5px/1 inherit; letter-spacing:.7px;
    text-transform:uppercase; color:var(--tenue); padding:9px 12px 2px;
  }

   
  main{padding:0 12px calc(28px + env(safe-area-inset-bottom))}
  .mese{
    font:700 12px/1 inherit; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--tenue); margin:18px 2px 8px;
  }

  .ev{
    display:flex; gap:11px; align-items:flex-start;
    border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
    background:#fff; border:1px solid var(--bordo);
  }
   
  .ev.allenamento{border:2px solid var(--verde); background:var(--verde-chiaro); color:var(--testo)}
  .ev.allenamento .quando{color:var(--verde-scuro)}
  .ev.allenamento .dove,.ev.allenamento .luogo{color:var(--tenue-forte)}
  .ev.partita{background:var(--verde); border-color:var(--verde); color:#fff}
  .ev.partita .quando,.ev.partita .dove,.ev.partita .luogo{color:rgba(255,255,255,.96)}
   
  .ev.passato{opacity:.72}
  .ev.oggi{box-shadow:0 0 0 2px var(--verde-scuro)}

  .quando{flex:0 0 42px; text-align:center; color:var(--tenue); line-height:1.15}
  .quando b{display:block; font-size:21px; font-weight:800; letter-spacing:-.5px}
  .quando span{font-size:10px; text-transform:uppercase; letter-spacing:.6px}

  .corpo{flex:1; min-width:0}
  .titolo{font-weight:700; word-break:break-word}
  .riga2{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:2px; font-size:13px}
  .ora{font-weight:600}
  .dove{color:var(--tenue-forte); font-size:12px; font-weight:600}
  .luogo{
    display:block; margin-top:5px; font-size:12.5px; color:var(--tenue-forte);
    text-decoration:none; word-break:break-word;
  }
  .ev.partita .luogo{text-decoration:underline; text-underline-offset:2px}
  .luogo u{text-decoration:underline; text-underline-offset:2px}
  .note{
    margin-top:7px; padding-top:7px; font-size:13px; white-space:pre-wrap;
    border-top:1px solid rgba(128,128,128,.25);
  }

  .vuoto{text-align:center; color:var(--tenue); padding:44px 16px; font-size:14px}
  .errore{
    background:#fdecea; border:1px solid #f5b8b1; color:#8c1d13;
    border-radius:10px; padding:12px; margin:14px 0; font-size:13.5px;
  }
  .pie{text-align:center; color:var(--tenue); font-size:11.5px; padding:18px 0 4px}
  .pie button{
    background:none; border:0; color:var(--verde); font:inherit;
    text-decoration:underline; cursor:pointer;
  }
   
  .pref{margin-top:9px; display:flex; gap:6px; justify-content:center; align-items:center; flex-wrap:wrap}
  .pref button{
    border:1px solid var(--bordo); background:#fff; color:var(--tenue-forte);
    border-radius:999px; padding:6px 12px; font:600 11.5px/1 inherit;
    text-decoration:none; cursor:pointer;
  }
  .pref button.fatto{border-color:var(--verde); background:var(--verde); color:#fff}
  .pref button.scorda{border:0; background:none; color:var(--tenue); text-decoration:underline}

   
  .comp{background:#fff; border:1px solid var(--bordo); border-radius:12px; margin:12px 0; overflow:hidden}
  .comp h2{margin:0; padding:12px 13px; font-size:14px; background:var(--verde-chiaro); color:var(--verde-scuro)}
  .ling{display:flex; gap:4px; overflow-x:auto; padding:8px 8px 0; border-bottom:1px solid var(--bordo)}
  .ling button{
    flex:0 0 auto; background:none; border:0; border-bottom:3px solid transparent;
    color:var(--tenue); font:600 13px/1 inherit; padding:8px 10px; cursor:pointer;
  }
  .ling button[aria-selected="true"]{color:var(--verde); border-bottom-color:var(--verde)}
  .telaio{position:relative; overflow:hidden; padding:8px}
  .telaio iframe{width:500px; border:0; display:block; transform-origin:top left}
  .fallback{font-size:12px; color:var(--tenue); padding:0 10px 10px; text-align:center}
  .fallback a{color:var(--verde)}
  [hidden]{display:none!important}
</style>

<div id="vistaAgenda">
  <div class="barra">
    <button class="pill" aria-pressed="true" onclick="filtro('')">Tutto</button>
    <button class="pill" aria-pressed="false" onclick="filtro('allenamento')">Allenamenti</button>
    <button class="pill" aria-pressed="false" onclick="filtro('partita')">Partite</button>
    <input class="cerca" id="cerca" type="search" placeholder="Cerca avversario, campo…"
           oninput="disegna()" autocomplete="off">
  </div>

  <div class="periodo">
    <button class="freccia" id="prec" onclick="sposta(-1)" aria-label="periodo precedente">‹</button>
    <div class="scelta">
      <button aria-pressed="false" onclick="periodo('sett')">Sett.</button>
      <button aria-pressed="false" onclick="periodo('mese')">Mese</button>
      <button aria-pressed="true"  onclick="periodo('tutti')">Tutti</button>
    </div>
    <button class="freccia" id="succ" onclick="sposta(1)" aria-label="periodo successivo">›</button>
    <button class="oggi" id="oggi" onclick="vaiAOggi()">Oggi</button>
  </div>
  <div class="etichetta" id="etichetta"></div>

  <main id="lista"><div class="vuoto">Caricamento…</div></main>
</div>

<div id="vistaCampionato" hidden>
  <main id="competizioni"><div class="vuoto">Caricamento…</div></main>
</div>

<script>
  var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
              'agosto','settembre','ottobre','novembre','dicembre'];
  var GIORNI = ['dom','lun','mar','mer','gio','ven','sab'];

  var MESIBREVI = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];

  var EVENTI = [], TIPO = '', OGGI = iso(new Date()), COMPET = [], PRIMOGIRO = true;
  

  var VISTA = 'sett', RIF = new Date();

  

  var CHIAVE_PREF = 'apPreferenze';
  function leggiPref(){
    try{ return JSON.parse(localStorage.getItem(CHIAVE_PREF) || 'null'); }catch(e){ return null; }
  }

  function iso(d){
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  
  

  function statica(){ return typeof STATICO !== 'undefined' && STATICO; }

  function carica(forza){
    if(statica()){
      fetch('agenda.json?t=' + Date.now(), {cache:'no-store'})
        .then(function(r){
          if(!r.ok) throw new Error('agenda.json: ' + r.status);
          return r.json();
        })
        .then(function(r){
          EVENTI = r.eventi || [];
          COMPET = r.competizioni || [];
          window.AGGIORNATO = r.aggiornato;
          disegna();
        })
        .catch(function(e){ erroreLista(e.message || String(e)); });
      return;
    }

    google.script.run
      .withSuccessHandler(function(r){
        try{
          if(!r || !r.ok){ erroreLista((r && r.errore) || 'Il calendario non risponde.'); return; }
          EVENTI = r.eventi || [];
          window.AGGIORNATO = r.aggiornato;
          disegna();
        }catch(e){ erroreLista('Errore nel disegno: ' + e.message); }
      })
      .withFailureHandler(function(e){ erroreLista(e.message || String(e)); })
      .apCaricaAgenda(!!forza);
  }

  function erroreLista(msg){
    document.getElementById('lista').innerHTML =
      '<div class="errore"><b>Non riesco a leggere il calendario.</b><br>' + esc(msg) + '</div>';
  }

  
  function filtro(t){
    TIPO = t;
    aggiornaPill();
    disegna();
  }

  function aggiornaPill(){
    var b = document.querySelectorAll('.barra .pill');
    var ordine = ['','allenamento','partita'];
    for(var i=0;i<b.length;i++) b[i].setAttribute('aria-pressed', String(ordine[i] === TIPO));
  }

  
  function periodo(v){
    VISTA = v;
    if(v !== 'tutti') RIF = new Date();   
    aggiornaBarra();
    disegna();
  }

  function sposta(passi){
    if(VISTA === 'sett')  RIF = new Date(RIF.getTime() + passi * 7 * 86400000);
    if(VISTA === 'mese')  RIF = new Date(RIF.getFullYear(), RIF.getMonth() + passi, 1);
    aggiornaBarra();
    disegna();
  }

  function vaiAOggi(){
    RIF = new Date();
    aggiornaBarra();
    disegna();
    if(VISTA === 'tutti') vaiAlProssimo();
  }

  function aggiornaBarra(){
    var b = document.querySelectorAll('.scelta button');
    var ordine = ['sett','mese','tutti'];
    for(var i=0;i<b.length;i++) b[i].setAttribute('aria-pressed', String(ordine[i] === VISTA));

    var tutti = VISTA === 'tutti';
    ['prec','succ','oggi'].forEach(function(id){ document.getElementById(id).disabled = tutti; });
    document.getElementById('etichetta').textContent = etichetta();
  }

   
  function lunedi(d){
    var g = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    g.setDate(g.getDate() - ((g.getDay() + 6) % 7));
    return g;
  }

  function settimanaISO(d){
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    var primo = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - primo) / 86400000 - 3 + ((primo.getDay() + 6) % 7)) / 7);
  }

   
  function finestra(){
    if(VISTA === 'sett'){
      var l = lunedi(RIF);
      return { da: iso(l), a: iso(new Date(l.getTime() + 6 * 86400000)) };
    }
    if(VISTA === 'mese'){
      return {
        da: iso(new Date(RIF.getFullYear(), RIF.getMonth(), 1)),
        a:  iso(new Date(RIF.getFullYear(), RIF.getMonth() + 1, 0))
      };
    }
    return null;
  }

  function etichetta(){
    if(VISTA === 'sett'){
      var l = lunedi(RIF), d = new Date(l.getTime() + 6 * 86400000);
      return 'Sett. ' + settimanaISO(l) + ' · ' +
             l.getDate() + ' ' + MESIBREVI[l.getMonth()] + ' – ' +
             d.getDate() + ' ' + MESIBREVI[d.getMonth()] + ' ' + d.getFullYear();
    }
    if(VISTA === 'mese') return MESI[RIF.getMonth()].toUpperCase() + ' ' + RIF.getFullYear();
    return 'tutta la stagione';
  }

  function sezione(quale){
    var agenda = quale === 'agenda';
    document.getElementById('vistaAgenda').hidden = !agenda;
    document.getElementById('vistaCampionato').hidden = agenda;
    var b = document.querySelectorAll('.sezioni button');
    b[0].setAttribute('aria-selected', String(agenda));
    b[1].setAttribute('aria-selected', String(!agenda));
    if(!agenda) disegnaCompetizioni();
  }

  
  function disegna(){
    var q = (document.getElementById('cerca').value || '').trim().toLowerCase();
    var f = finestra();

    var righe = EVENTI.filter(function(e){
      if(TIPO && e.tipo !== TIPO) return false;
      if(f && (e.dataISO < f.da || e.dataISO > f.a)) return false;
      if(!q) return true;
      return (e.titolo + ' ' + e.avversario + ' ' + e.luogo + ' ' + e.note).toLowerCase().indexOf(q) !== -1;
    });

    var lista = document.getElementById('lista');
    if(!righe.length){
      lista.innerHTML = '<div class="vuoto">' +
        (f ? 'Niente in questo periodo.<br>Usa le frecce o passa a <b>Tutti</b>.'
           : 'Nessun impegno con questi filtri.') +
        '</div>' + piede();
      return;
    }

    var html = '', mese = '', ancora = '';
    righe.forEach(function(e){
      var d = e.dataISO.split('-');
      var etichetta = MESI[Number(d[1])-1] + ' ' + d[0];
      if(etichetta !== mese){ mese = etichetta; html += '<div class="mese">' + mese + '</div>'; }

      var g = new Date(Number(d[0]), Number(d[1])-1, Number(d[2]));
      var passato = e.dataISO < OGGI;
      if(!passato && !ancora){ ancora = ' id="prossimo"'; }

      var classi = 'ev ' + (e.tipo === 'allenamento' ? 'allenamento' : 'partita') +
                   (passato ? ' passato' : '') + (e.dataISO === OGGI ? ' oggi' : '');

      var quando = e.tuttoGiorno ? 'tutto il giorno'
                 : (e.ora + (e.oraFine ? '–' + e.oraFine : ''));

      var dove = e.dove === 'casa' ? 'in casa' : (e.dove === 'trasferta' ? 'in trasferta' : '');

      html += '<article class="' + classi + '"' + ancora + ' onclick="apri(this)">' +
                '<div class="quando"><b>' + Number(d[2]) + '</b><span>' + GIORNI[g.getDay()] + '</span></div>' +
                '<div class="corpo">' +
                  '<div class="titolo">' + esc(e.titolo) + '</div>' +
                  '<div class="riga2"><span class="ora">' + esc(quando) + '</span>' +
                    (dove ? '<span class="dove">' + dove + '</span>' : '') + '</div>' +
                  luogoHtml(e) +
                  (e.note ? '<div class="note" hidden>' + esc(e.note) + '</div>' : '') +
                '</div>' +
              '</article>';
      ancora = '';
    });

    lista.innerHTML = html + piede();
    if(PRIMOGIRO && VISTA === 'tutti'){ PRIMOGIRO = false; vaiAlProssimo(); }
  }

  function luogoHtml(e){
    if(!e.luogo) return '';
    var url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.luogo);
    return '<a class="luogo" href="' + esc(url) + '" target="_blank" rel="noopener" ' +
           'onclick="event.stopPropagation()">📍 <u>' + esc(e.luogo) + '</u></a>';
  }

  function piede(){
    return '<div class="pie">aggiornato il ' + esc(window.AGGIORNATO || '—') +
           ' · <button onclick="carica(true)">ricarica</button>' +
           '<div class="pref">' +
             '<button id="btnPref" onclick="salvaPref()">Apri sempre così</button>' +
             (leggiPref() ? '<button class="scorda" onclick="scordaPref()">azzera</button>' : '') +
           '</div></div>';
  }

  function nomeVista(){
    return VISTA === 'sett' ? 'settimana' : (VISTA === 'mese' ? 'mese' : 'tutta la stagione');
  }
  function nomeTipo(){
    return TIPO === 'allenamento' ? 'solo allenamenti'
         : (TIPO === 'partita' ? 'solo partite' : 'tutto');
  }

  function salvaPref(){
    var b = document.getElementById('btnPref');
    try{
      localStorage.setItem(CHIAVE_PREF, JSON.stringify({tipo:TIPO, vista:VISTA}));
    }catch(e){
       
      b.textContent = 'non riesco a salvare qui';
      return;
    }
    b.textContent = '✓ salvato: ' + nomeTipo() + ' · ' + nomeVista();
    b.className = 'fatto';
    setTimeout(disegna, 1800);
  }

  function scordaPref(){
    try{ localStorage.removeItem(CHIAVE_PREF); }catch(e){}
    disegna();
  }

  function apri(card){
    var n = card.querySelector('.note');
    if(n) n.hidden = !n.hidden;
  }

  function vaiAlProssimo(){
    var el = document.getElementById('prossimo');
    if(el) el.scrollIntoView({block:'center'});
  }

  
  var COMPET_DISEGNATE = false;

  function disegnaCompetizioni(){
    if(COMPET_DISEGNATE) return;
    
    if(statica() || COMPET.length){ rendiCompetizioni(); return; }
    google.script.run
      .withSuccessHandler(function(c){ COMPET = c || []; rendiCompetizioni(); })
      .withFailureHandler(function(e){
        document.getElementById('competizioni').innerHTML =
          '<div class="errore">' + esc(e.message || e) + '</div>';
      })
      .apLeggiWidget();
  }

  function rendiCompetizioni(){
    var box = document.getElementById('competizioni');
    if(!COMPET.length){
      box.innerHTML = '<div class="vuoto">Nessun widget TuttoCampo impostato.</div>';
      return;
    }
    box.innerHTML = COMPET.map(compHtml).join('');
    COMPET.forEach(function(c, i){ mostraSezione(i, 0); });
    COMPET_DISEGNATE = true;
  }

  function compHtml(c, i){
    var attive = (c.sezioni || []).filter(function(s){ return s.attiva !== false; });
    return '<section class="comp">' +
             '<h2>' + esc(c.competizione) + '</h2>' +
             '<div class="ling" role="tablist">' +
               attive.map(function(s, j){
                 return '<button role="tab" aria-selected="' + (j===0) + '" ' +
                        'onclick="mostraSezione(' + i + ',' + j + ')">' + esc(s.label) + '</button>';
               }).join('') +
             '</div>' +
             '<div class="telaio" id="telaio' + i + '"></div>' +
             '<div class="fallback">Se il riquadro resta vuoto, ' +
               '<a id="diretto' + i + '" href="#" target="_blank" rel="noopener">aprilo su TuttoCampo</a>.</div>' +
           '</section>';
  }

  function mostraSezione(i, j){
    var c = COMPET[i];
    var attive = (c.sezioni || []).filter(function(s){ return s.attiva !== false; });
    var s = attive[j];
    if(!s) return;

    var comp = document.getElementById('telaio' + i).closest('.comp');
    var bottoni = comp.querySelectorAll('.ling button');
    for(var k=0;k<bottoni.length;k++) bottoni[k].setAttribute('aria-selected', String(k===j));

    var url = 'https://www.tuttocampo.it/WidgetV2/' + s.tipo + '/' + c.guid;
    document.getElementById('diretto' + i).href = url;

    var telaio = document.getElementById('telaio' + i);
    telaio.innerHTML = '<iframe src="' + esc(url) + '" height="' + s.altezza +
                       '" scrolling="no" loading="lazy"></iframe>';
    scala(telaio, s.altezza);
  }

  

  function scala(telaio, altezza){
    var disponibile = telaio.clientWidth - 16;
    var s = Math.min(1, disponibile / 500);
    var f = telaio.querySelector('iframe');
    if(!f) return;
    f.style.transform = 'scale(' + s + ')';
    telaio.style.height = Math.round(altezza * s + 16) + 'px';
  }

  window.addEventListener('resize', function(){
    document.querySelectorAll('.telaio').forEach(function(t){
      var f = t.querySelector('iframe');
      if(f) scala(t, Number(f.getAttribute('height')) || 400);
    });
  });

  (function applicaPref(){
    var p = leggiPref();
    if(!p) return;
    if(['','allenamento','partita'].indexOf(p.tipo) !== -1) TIPO = p.tipo;
    if(['sett','mese','tutti'].indexOf(p.vista) !== -1) VISTA = p.vista;
  })();

  aggiornaPill();
  aggiornaBarra();
  carica(false);
</script>

</body>
</html>
